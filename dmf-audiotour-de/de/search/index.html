    <!-- ⭐ QR SCANNER SCRIPT -->
    <script>
    document.addEventListener("DOMContentLoaded", function () {
        const startBtn = document.getElementById("start-qr");
        const overlay = document.getElementById("qr-overlay");
        const qrReader = document.getElementById("qr-reader");
        let qrScanner = null;

        function onScanSuccess(decodedText) {
            const allowedHost = window.location.host;
            try {
                const url = new URL(decodedText);
                if (url.host === allowedHost) {
                    qrScanner.stop();
                    overlay.classList.remove("active");
                    window.location.href = decodedText;
                } else {
                    alert("Alleen interne audiotour-links zijn toegestaan.");
                    overlay.classList.remove("active");
                    if (qrScanner) qrScanner.stop();
                }
            } catch {
                alert("Ongeldige QR-code.");
                overlay.classList.remove("active");
                if (qrScanner) qrScanner.stop();
            }
        }

        function onScanError(errorMessage) {
            console.warn("QR scan error:", errorMessage);
        }

        if (startBtn && overlay && qrReader) {
            startBtn.addEventListener("click", function () {
                overlay.classList.add("active");
                setTimeout(async () => {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                        stream.getTracks().forEach(track => track.stop());
                        qrScanner = new Html5Qrcode("qr-video-wrapper");
                        const config = { fps: 10, qrbox: { width: 250, height: 250 } };
                        const cameras = await Html5Qrcode.getCameras();
                        if (cameras && cameras.length > 0) {
                            const rearCamera = cameras.find(cam => {
                                const label = (cam.label || "").toLowerCase();
                                return /back|rear|environment|achter|achterkant|selfie/.test(label) && !/front|voor/.test(label);
                            });
                            const cameraId = (rearCamera || cameras[0]).id;
                            await qrScanner.start(cameraId, config, onScanSuccess, onScanError);
                        } else {
                            alert("Geen camera gevonden");
                            overlay.classList.remove("active");
                        }
                    } catch (error) {
                        alert("Camera toegang geweigerd: " + error.message);
                        overlay.classList.remove("active");
                    }
                }, 500);
            });

            overlay.addEventListener("click", function (e) {
                if (e.target === overlay) {
                    overlay.classList.remove("active");
                    if (qrScanner) qrScanner.stop();
                }
            });
        }
    });
    </script>
