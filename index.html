<!doctype html>
<html lang="nl">
  
  <head>
    <meta charset="utf-8" />
    <title>Audiotours – De Museumfabriek</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/typography.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>

  <body class="start">
    <!-- =============================
         HEADER
         ============================= -->
    <header class="start-header">
      <img
        src="images/museum_logo.png"
        alt="De Museumfabriek"
        class="start-logo"
      />

      <img
        src="images/hero_audiotours.jpg"
        alt=""
        aria-hidden="true"
        class="start-hero"
      />
    </header>

    <!-- =============================
         CONTENT
         ============================= -->
    <main class="start-content">
      <h1 class="start-title">
        <span class="icon" aria-hidden="true">🎧</span>
        Audiotours
      </h1>

      
      <section aria-label="Beschikbare audiotours">
        <ul class="tour-list">
          
          <li>
            <a
              href="tours/off/NL/start.html"
              class="tour-item"
              aria-label="Start audiotour Offerschatten uit het verleden van Oost-Nederland. in "
            >
              <!-- Vlag -->
              <span class="tour-flag">
                <img
                  src="images/flags/nl.svg"
                  alt=""
                />
              </span>

              <!-- Titel -->
              <span class="tour-name"> Offerschatten uit het verleden van Oost-Nederland. </span>

              <!-- Duur -->
              
              <span class="tour-duration"> ⏱ 20 min </span>
              
            </a>
          </li>
          
          <li>
            <a
              href="tours/off/EN/start.html"
              class="tour-item"
              aria-label="Start audiotour Offerschatten. Finds from the Past of Eastern Netherlands. in "
            >
              <!-- Vlag -->
              <span class="tour-flag">
                <img
                  src="images/flags/en.svg"
                  alt=""
                />
              </span>

              <!-- Titel -->
              <span class="tour-name"> Offerschatten. Finds from the Past of Eastern Netherlands. </span>

              <!-- Duur -->
              
              <span class="tour-duration"> ⏱ 20 min </span>
              
            </a>
          </li>
          
          <li>
            <a
              href="tours/off/DE/start.html"
              class="tour-item"
              aria-label="Start audiotour Offerschatten. Funde aus der Vergangenheit des östlichen Niederlands. in "
            >
              <!-- Vlag -->
              <span class="tour-flag">
                <img
                  src="images/flags/de.svg"
                  alt=""
                />
              </span>

              <!-- Titel -->
              <span class="tour-name"> Offerschatten. Funde aus der Vergangenheit des östlichen Niederlands. </span>

              <!-- Duur -->
              
              <span class="tour-duration"> ⏱ 20 min </span>
              
            </a>
          </li>
          
        </ul>
      </section>
      
    </main>

    <!-- =============================
         FOOTER
         ============================= -->
    <footer class="footer">
      <p>© 2026 De Museumfabriek</p>
    </footer>
  </body>
</html>
