

<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./static/css/main.css">
  <title>Welkom - De Museumfabriek</title>
  <style>
    .welkom-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .welkom-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      max-width: 600px;
      width: 100%;
      text-align: center;
    }
    
    .logo-container {
      margin-bottom: 30px;
    }
    
    .logo-container img {
      max-width: 300px;
      width: 100%;
      height: auto;
    }
    
    .welkom-foto {
      width: 100%;
      max-width: 500px;
      height: 300px;
      object-fit: cover;
      border-radius: 15px;
      margin-bottom: 30px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }
    
    .welkom-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 32px;
      color: #004d80;
      margin-bottom: 10px;
      font-weight: 700;
    }
    
    .welkom-subtitle {
      font-size: 18px;
      color: #666;
      margin-bottom: 30px;
    }
    
    .talen-section {
      margin-bottom: 30px;
    }
    
    .talen-title {
      font-size: 20px;
      color: #004d80;
      margin-bottom: 15px;
      font-weight: 600;
    }
    
    .talen-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }
    
    .taal-button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 15px 20px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    
    .taal-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
    }
    
    .taal-button.selected {
      background: linear-gradient(135deg, #004d80 0%, #003d66 100%);
      transform: scale(1.05);
    }
    
    .start-button {
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
      color: white;
      border: none;
      padding: 18px 50px;
      border-radius: 50px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 16px rgba(238, 90, 111, 0.3);
      text-decoration: none;
      display: inline-block;
    }
    
    .start-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 24px rgba(238, 90, 111, 0.4);
    }
    
    .start-button:active {
      transform: translateY(-1px);
    }
    
    .start-button:disabled {
      background: #ccc;
      cursor: not-allowed;
      box-shadow: none;
    }
    
    .taal-info {
      color: #999;
      font-size: 14px;
      margin-top: 10px;
      font-style: italic;
    }
    
    @media (max-width: 600px) {
      .welkom-card {
        padding: 30px 20px;
      }
      
      .welkom-title {
        font-size: 24px;
      }
      
      .welkom-subtitle {
        font-size: 16px;
      }
      
      .talen-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      
      .welkom-foto {
        height: 200px;
      }
      
      .start-button {
        padding: 15px 40px;
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="welkom-container">
    <div class="welkom-card">
      <div class="logo-container">
        <img src="images/DMFlogo.png" alt="De Museumfabriek Logo">
      </div>
      
      <img src="images/museumfabriek-foto.jpg" alt="De Museumfabriek" class="welkom-foto">
      
      <h1 class="welkom-title" id="welkom-titel">Welkom bij de Audiotour</h1>
      <p class="welkom-subtitle" id="welkom-ondertitel">Ontdek de verhalen van De Museumfabriek</p>
      
      <div class="talen-section">
        <div class="talen-title">Kies uw taal / Choose your language</div>
        <div class="talen-grid">
          <button class="taal-button" data-taal="NL" onclick="selectTaal('NL', this)">
            🇳🇱 Nederlands
          </button>
          <button class="taal-button" data-taal="DE" onclick="selectTaal('DE', this)">
            🇩🇪 Deutsch
          </button>
          <button class="taal-button" data-taal="UK" onclick="selectTaal('UK', this)">
            🇬🇧 English
          </button>
          <button class="taal-button" data-taal="TW" onclick="selectTaal('TW', this)">
            🗣️ Tweants
          </button>
        </div>
        <div class="taal-info" id="taal-info">Selecteer een taal om te beginnen</div>
      </div>
      
      <button class="start-button" id="start-button" onclick="startTour()" disabled>
        <span id="start-tekst">Start Audiotour</span>
      </button>
    </div>
  </div>

  <script>
    const translations = {
      'NL': {
        'taal_geselecteerd': 'Taal geselecteerd:',
        'nederlands': 'Nederlands',
        'duits': 'Duits',
        'engels': 'Engels',
        'twents': 'Twents'
      },
      'UK': {
        'taal_geselecteerd': 'Language selected:',
        'nederlands': 'Dutch',
        'duits': 'German',
        'engels': 'English',
        'twents': 'Twents'
      },
      'DE': {
        'taal_geselecteerd': 'Sprache ausgewählt:',
        'nederlands': 'Niederländisch',
        'duits': 'Deutsch',
        'engels': 'Englisch',
        'twents': 'Twents'
      },
      'TW': {
        'taal_geselecteerd': 'Taal ekozen:',
        'nederlands': 'Nederlaans',
        'duits': 'Duuts',
        'engels': 'Ingels',
        'twents': 'Tweants'
      }
    };
    
    let geselecteerdeTaal = null;
    
    function selectTaal(taalCode, button) {
      // Remove selected class from all buttons
      document.querySelectorAll('.taal-button').forEach(btn => {
        btn.classList.remove('selected');
      });
      
      // Add selected class to clicked button
      button.classList.add('selected');
      
      // Store selected language
      geselecteerdeTaal = taalCode;
      
      // Enable start button
      document.getElementById('start-button').disabled = false;
      
      // Update info text
      const t = translations[taalCode];
      const taalNamen = {
        'NL': 'nederlands',
        'UK': 'engels',
        'DE': 'duits',
        'TW': 'twents'
      };
      const taalNaam = t[taalNamen[taalCode]];
      document.getElementById('taal-info').textContent = `${t.taal_geselecteerd} ${taalNaam}`;
    }
    
    function startTour() {
      if (!geselecteerdeTaal) {
        alert('Selecteer eerst een taal / Please select a language');
        return;
      }
      
      // Store language preference in localStorage
      localStorage.setItem('selectedLanguage', geselecteerdeTaal);
      
      const taalDir = geselecteerdeTaal.toLowerCase();
      
      // Check if we're running as Flask app by looking for Flask-specific indicators
      // If the page has Flask template variables or was served from Flask routes
      const isFlaskApp = document.body.getAttribute('data-flask-app') === 'true' ||
                        window.location.pathname.includes('/rondleidingen');
      
      if (isFlaskApp) {
        // Flask app: use Flask route
        window.location.href = '/?taal=' + geselecteerdeTaal;
      } else {
        // Static site (GitHub Pages, file://): use relative path to language directory
        // Using relative path will work regardless of base URL
        window.location.href = taalDir + '/index.html';
      }
    }
    
    // Check if language was previously selected
    window.addEventListener('DOMContentLoaded', function() {
      let savedLanguage = localStorage.getItem('selectedLanguage');
      
      // Migratie: EN -> UK
      if (savedLanguage === 'EN') {
        savedLanguage = 'UK';
        localStorage.setItem('selectedLanguage', savedLanguage);
      }
      
      if (savedLanguage) {
        const button = document.querySelector(`[data-taal="${savedLanguage}"]`);
        if (button) {
          selectTaal(savedLanguage, button);
        }
      }
    });
  </script>
</body>
</html>
