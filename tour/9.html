<script>
(function(){
  const audio = document.getElementById('mainAudio');
  const curSecSpan = document.getElementById('curSec');

  // Build beelden array (paths already resolved server-side)
  const beelden = [
    
  ];
 
  // Ensure sorted by sec numeric
  beelden.sort((a,b) => (a.sec||0) - (b.sec||0));
 console.log(beelden.length)
  const captionEl = document.getElementById('imageCaption');
  const imageBox = document.getElementById('imageBox');

  function getImageElement() {
    return document.getElementById('currentImage');
  }

  function showBeeld(i){
    if(!beelden.length) return;
    const b = beelden[i];
    const imgEl = getImageElement();
    if (imgEl && imgEl.tagName && imgEl.tagName.toLowerCase() === 'img') {
      imgEl.src = b.naam;
      imgEl.alt = b.caption || ("Beeld " + b.id);
    } else {
      // if placeholder div present, replace with <img>
      const newImg = document.createElement('img');
      newImg.id = 'currentImage';
      newImg.src = b.naam;
      newImg.alt = b.caption || ("Beeld " + b.id);
      newImg.style.width = '100%';
      imageBox.innerHTML = '';
      imageBox.appendChild(newImg);
    }
    // set caption text safely (textContent)
    captionEl.textContent = "";
    const strong = document.createElement('strong');
    // strong.textContent = "@" + b.sec + "s";
    captionEl.appendChild(strong);
    // captionEl.appendChild(document.createTextNode(" — " + (b.caption || b.naam)));
    captionEl.appendChild(document.createTextNode((b.caption || b.naam)));
  }

  let lastIndex = -1;

  function findIndexForSecond(sec) {
    // find the last beeld whose sec <= current second
    let idx = -1;
    for (let i = 0; i < beelden.length; i++) {
      if ((beelden[i].sec || 0) <= sec) idx = i;
      else break;
    }
    return idx;
  }

  function onTimeUpdate(){
    const sec = Math.floor(audio.currentTime || 0);
    curSecSpan.textContent = sec;
    const idx = findIndexForSecond(sec);
    if (idx !== lastIndex && idx !== -1) {
      showBeeld(idx);
      lastIndex = idx;
    }
  }

  // Fallback polling for browsers where timeupdate is not frequent enough:
  let pollInterval = null;
  function startPolling() {
    if (pollInterval) return;
    pollInterval = setInterval(function(){
      if (!audio.paused && !audio.ended) onTimeUpdate();
    }, 250); // 250ms
  }
  function stopPolling() {
    if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
  }

  if (audio) {
    audio.addEventListener('timeupdate', onTimeUpdate);
    audio.addEventListener('play', function(){
      onTimeUpdate();
      startPolling();
    });
    audio.addEventListener('pause', stopPolling);
    audio.addEventListener('ended', stopPolling);
    audio.addEventListener('seeked', onTimeUpdate);
    // initial update (in case audio is already at >0)
    setTimeout(onTimeUpdate, 200);
  }

  // Clicking image jumps to next beeld (convenience)
  imageBox.addEventListener('click', function(){
    if(!beelden.length || !audio) return;
    let next = lastIndex + 1;
    if (next >= beelden.length) next = 0;
    const targetSec = beelden[next].sec || 0;
    audio.currentTime = targetSec;
    audio.play();
    showBeeld(next);
    lastIndex = next;
  });

})();
</script>
