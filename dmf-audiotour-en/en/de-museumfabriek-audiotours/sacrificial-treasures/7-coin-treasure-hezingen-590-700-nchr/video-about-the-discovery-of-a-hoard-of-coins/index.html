    <!-- ⭐ QR SCANNER SCRIPT -->
    <script>
    document.addEventListener("DOMContentLoaded", function () {
        const startBtn = document.getElementById("start-qr");
        const overlay = document.getElementById("qr-overlay");
        const qrReader = document.getElementById("qr-reader");
        let qrScanner = null;

        function onScanSuccess(decodedText) {
            const allowedHost = window.location.host;
            try {
                const url = new URL(decodedText);
                if (url.host === allowedHost) {
                    qrScanner.stop();
                    overlay.classList.remove("active");
                    window.location.href = decodedText;
                } else {
                    alert("Alleen interne audiotour-links zijn toegestaan.");
                    overlay.classList.remove("active");
                    if (qrScanner) qrScanner.stop();
                }
            } catch {
                alert("Ongeldige QR-code.");
                overlay.classList.remove("active");
                if (qrScanner) qrScanner.stop();
            }
        }

        function onScanError(errorMessage) {
            console.warn("QR scan error:", errorMessage);
        }

        if (startBtn && overlay && qrReader) {
            startBtn.addEventListener("click", function () {
                overlay.classList.add("active");
                setTimeout(async () => {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                        stream.getTracks().forEach(track => track.stop());
                        qrScanner = new Html5Qrcode("qr-video-wrapper");
                        const config = { fps: 10, qrbox: { width: 250, height: 250 } };
                        const cameras = await Html5Qrcode.getCameras();
                        if (cameras && cameras.length > 0) {
                            const rearCamera = cameras.find(cam => {
                                const label = (cam.label || "").toLowerCase();
                                return /back|rear|environment|achter|achterkant|selfie/.test(label) && !/front|voor/.test(label);
                            });
                            const cameraId = (rearCamera || cameras[0]).id;
                            await qrScanner.start(cameraId, config, onScanSuccess, onScanError);
                        } else {
                            alert("Geen camera gevonden");
                            overlay.classList.remove("active");
                        }
                    } catch (error) {
                        alert("Camera toegang geweigerd: " + error.message);
                        overlay.classList.remove("active");
                    }
                }, 500);
            });

            overlay.addEventListener("click", function (e) {
                if (e.target === overlay) {
                    overlay.classList.remove("active");
                    if (qrScanner) qrScanner.stop();
                }
            });
        }
    });
    </script>

<script>
(function() {
    function getVersion(re, ua) {
        var m = ua.match(re);
        return m ? parseFloat(m[1]) : null;
    }

    function parsePlatformVersion(version) {
        if (!version) {
            return null;
        }
        return parseFloat(version.replace(/_/g, '.'));
    }

    function getAndroidVersionFromUA(ua) {
        return getVersion(/Android\s+([0-9]+(?:\.[0-9]+)?)/i, ua);
    }

    function getAndroidVersion(callback) {
        var ua = navigator.userAgent || '';
        var version = getAndroidVersionFromUA(ua);
        if (version) {
            callback(version);
            return;
        }

        if (navigator.userAgentData && typeof navigator.userAgentData.getHighEntropyValues === 'function') {
            navigator.userAgentData.getHighEntropyValues(['platformVersion'])
                .then(function(data) {
                    callback(parsePlatformVersion(data.platformVersion));
                })
                .catch(function() {
                    callback(null);
                });
            return;
        }

        if (navigator.userAgentData && navigator.userAgentData.platform === 'Android') {
            callback(parsePlatformVersion(navigator.userAgentData.platformVersion));
            return;
        }

        callback(null);
    }

    function warnAndroid(version) {
        if (version && version < 12) {
            return 'Uw Android-telefoon of tablet draait een oudere Android-versie (versie ' + version + '). Sommige functies kunnen minder goed werken.';
        }
        return null;
    }

    function shouldShowWarning() {
        var ua = navigator.userAgent || '';
        var isMobile = /Mobile|Android|iP(hone|ad|od)|Silk/.test(ua);
        if (!isMobile) {
            return null;
        }

        if (/iP(hone|ad|od)/.test(ua)) {
            var iosVersion = getVersion(/OS (\d+)_/, ua);
            if (iosVersion && iosVersion < 16) {
                return 'Deze iPhone/iPad gebruikt een oudere iOS-versie (versie ' + iosVersion + '). De website kan minder goed functioneren in oudere Safari-versies.';
            }
            return null;
        }

        if (/Android/.test(ua)) {
            return 'android';
        }

        if (/Windows Phone|BB10|Kindle|KF[A-Z]/.test(ua)) {
            return 'Dit apparaat of deze browser kan mogelijk niet volledig ondersteund worden.';
        }

        return null;
    }

    function showWarning(warningText) {
        if (!warningText) {
            return;
        }

        var banner = document.createElement('div');
        banner.id = 'device-warning-banner';
        banner.innerHTML = '<span>' + warningText + '</span>' +
                           '<button type="button" aria-label="Sluiten">Sluiten</button>';
        document.documentElement.insertBefore(banner, document.documentElement.firstChild);
        banner.style.display = 'block';

        banner.querySelector('button').addEventListener('click', function() {
            banner.style.display = 'none';
        });
    }

    var warningText = shouldShowWarning();
    if (warningText === 'android') {
        getAndroidVersion(function(androidVersion) {
            showWarning(warnAndroid(androidVersion));
        });
        return;
    }

    showWarning(warningText);

    banner.querySelector('button').addEventListener('click', function() {
        banner.style.display = 'none';
    });
})();
</script>
