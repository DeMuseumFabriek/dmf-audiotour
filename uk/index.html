  <title>Rondleidingen - De Museumfabriek</title>
  <style>
    .rondleidingen-container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
    }
    
    .rondleidingen-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .rondleidingen-table th {
      background-color: #004d80;
      color: white;
      padding: 15px;
      text-align: left;
      font-weight: 600;
      font-size: 16px;
    }
    
    .rondleidingen-table td {
      padding: 15px;
      border-bottom: 1px solid #e0e0e0;
    }
    
    .rondleidingen-table tr:last-child td {
      border-bottom: none;
    }
    
    .rondleidingen-table tr:hover {
      background-color: #f5f5f5;
    }
    
    .rondleiding-title {
      color: #004d80;
      font-size: 18px;
      font-weight: 600;
    }
    
    .locatie-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    .locatie-link {
      display: inline-block;
      background-color: #004d80;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      transition: background-color 0.2s ease;
      font-size: 14px;
    }
    
    .locatie-link:hover {
      background-color: #003d66;
    }
    
    .page-header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .page-header h1 {
      color: #004d80;
      font-size: 32px;
      margin-bottom: 10px;
    }
    
    .page-header p {
      color: #666;
      font-size: 16px;
    }
    
    .no-content {
      text-align: center;
      color: #999;
      font-style: italic;
      padding: 40px;
    }
  </style>
</head>
