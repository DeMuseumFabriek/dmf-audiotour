    <script>
      const audio = document.querySelector("audio");
      const beelden = document.querySelectorAll(".dp-beeld");

      if (audio && beelden.length > 1) {
        audio.addEventListener("timeupdate", () => {
          const t = Math.floor(audio.currentTime);

          let actief = beelden[0];
          beelden.forEach((b) => {
            if (t >= parseInt(b.dataset.sec)) {
              actief = b;
            }
          });
          beelden.forEach((b) => b.classList.add("is-hidden"));
          actief.classList.remove("is-hidden");
          
        });
      }
    </script>
