  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const svg = document.querySelector("#nav-svg-container svg");
      if (!svg) return;
      const coor_x = [9, 87, 142, 224, 301];
      const width = 46;
      const height = 30;
      const links = ["./expositieruimtes/Pakloods_3.html",
                      "../index.html",
                      "./plattegrond.html",
                      "./index.html",
                      "./expositieruimtes/Pakloods_1.html"]
      const svgns = "http://www.w3.org/2000/svg";
      const linkns = "http://www.w3.org/1999/xlink";
      for (let i = 0; i < 5; i++) {
        const x = coor_x[i];
        const y = 0;
        const link = document.createElementNS(svgns, "a");
        link.setAttribute("class", "hotspot");
        link.setAttribute("href", links[i] || "");
        // Create hotspot rectangle
        const rect = document.createElementNS(svgns, "rect");
        rect.setAttribute("x", x );
        rect.setAttribute("y", y );
        rect.setAttribute("width", width);
        rect.setAttribute("height", height);
        rect.setAttribute("fill-opacity", "0.0");
        // Append elements
        link.appendChild(rect);
        svg.appendChild(link);
      }
    });
  </script>

    <button onclick="myFunction2()" class="dropbtn" id="welcome-button">
      Willkommen in der MuseumFabriek!
      
    </button>
    <div id="myDropdown" class="dropdown-content">
      Welkom in de MuseumFabriek. Door op de genummerde rode cirkels te klikken ...
    </div>
  </div>

  <script>
    // Translations for static site
    const translations = {
      'NL': { title: 'Plattegrond', welcome: 'Welkom in de MuseumFabriek!' },
      'UK': { title: 'Map', welcome: 'Welcome to the MuseumFabriek!' },
      'DE': { title: 'Karte', welcome: 'Willkommen in der MuseumFabriek!' },
      'TW': { title: 'Plattegrond', welcome: 'Welkom in de MuseumFabriek!' }
    };
    
    // Apply translations from localStorage (for static site)
    if (window.location.protocol === 'file:') {
      const savedLanguage = localStorage.getItem('selectedLanguage') || 'NL';
      if (translations[savedLanguage]) {
        document.getElementById('page-title').textContent = translations[savedLanguage].title;
        document.getElementById('welcome-button').textContent = translations[savedLanguage].welcome;
      }
    }
  
    function myFunction2() {
      document.getElementById("myDropdown").classList.toggle("show");
    }
    window.onclick = function(event) {
      if (!event.target.matches('.dropbtn')) {
        var dropdowns = document.getElementsByClassName("dropdown-content");
        var i;
        for (i = 0; i < dropdowns.length; i++) {
          var openDropdown = dropdowns[i];
          if (openDropdown.classList.contains('show')) {
            openDropdown.classList.remove('show');
          }
        }
      }
    }
  </script>

    <script>
      document.addEventListener("DOMContentLoaded", function() {
      const svg = document.querySelector("#main-svg-container svg"); 
      let links = ["", "", "", "", "", "./expositieruimtes/Pakloods_1.html", "./expositieruimtes/Pakloods_2.html", "./expositieruimtes/Pakloods_3.html", ""]
      let coor_xs = [226, 190, 259, 226, 152, 100, 97, 85, 58]
      let coor_ys = [257, 216, 189, 139, 148, 84, 198, 316, 243]
      let expositie_ruimtes = ["Entree", "Bolruimte", "Auditorium", "Bankruimte", "Tunnel", "Pakloods 1", "Pakloods 2", "Pakloods 3", "Twentelab"]
      const svgns = "http://www.w3.org/2000/svg";
      const linkns = "http://www.w3.org/1999/xlink";
      let len = coor_xs.length;
      for (let i=0; i<len; i++) {
        const link = document.createElementNS(svgns, "a");
        const lnk = links[i];
        link.setAttribute("class", "hotspot");
        link.setAttributeNS(linkns, "xlink:href",  lnk);
        
        const w  =  20;
        const h  =  20;
        const ry =  10;
        const x = coor_xs[i] || 50;
        const y = coor_ys[i] || 50;
        const lx0=5;
        const ly0=15;
        const dy =15;
        const rect = document.createElementNS(svgns, "rect");
        rect.setAttribute("ry", ry);
        rect.setAttribute("x", x - w/2);
        rect.setAttribute("y", y - h/2);
        rect.setAttribute("width", w);
        rect.setAttribute("height", h);
        rect.setAttribute("fill",  "red");
        rect.setAttribute("fill-opacity", 0.30);

        const text = document.createElementNS(svgns, "text");
        text.setAttribute("x", x); 
        text.setAttribute("y", y);
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("alignment-baseline", "middle");
        text.setAttribute("fill",  "white");
        text.setAttribute("pointer-events", "none"); 
        text.setAttribute("font-size", (ry * 1.4).toString());
        text.textContent =   i;

        const label = document.createElementNS(svgns, "text");
        const lx = parseFloat(lx0); 
        const ly = parseFloat(ly0) + i * dy ; 
        label.setAttribute("x", lx); 
        label.setAttribute("y", ly);
        label.setAttribute("text-anchor", "start"); 
        label.setAttribute("class", "hotspot-label");
        label.textContent = i + '. ' + expositie_ruimtes[i];
     
        link.appendChild(rect);
        link.appendChild(text);
        link.appendChild(label);
        svg.appendChild(link);
      }
      });
