        document.addEventListener("DOMContentLoaded", function() {

                          "../index.html",

          const svgns = "http://www.w3.org/2000/svg";
          const linkns = "http://www.w3.org/1999/xlink";
          for (let i = 0; i < 4; i++) {
            const x = coor_x[i];
            const y = 0;
            const link = document.createElementNS(svgns, "a");
            link.setAttribute("class", "hotspot");
            link.setAttribute("href", links[i] || "");
            // Create hotspot rectangle
            const rect = document.createElementNS(svgns, "rect");
            rect.setAttribute("x", x );
            rect.setAttribute("y", y );
            rect.setAttribute("width", width);
            rect.setAttribute("height", height);
            rect.setAttribute("fill-opacity", "0.0");
            console.log( rect);
            // Append elements
            link.appendChild(rect);
            svg.appendChild(link);

  <script>
    // Modern dropdown implementation with event delegation
    (function() {
      const dropdownBtn = document.getElementById('dropdownBtn');
      const dropdown = document.getElementById('myDropdown');
      
      if (dropdownBtn && dropdown) {
        dropdownBtn.addEventListener('click', function(event) {
          event.stopPropagation();
          dropdown.classList.toggle('show');
        });
        
        // Prevent dropdown from closing when clicking inside it
        dropdown.addEventListener('click', function(event) {
          event.stopPropagation();
        });
        
        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
          if (dropdown.classList.contains('show') && 
              !event.target.matches('.dropbtn') && 
              !dropdown.contains(event.target)) {
            dropdown.classList.remove('show');
          }
        });
      }
    })();

  <script>
    // @ts-nocheck - Jinja2 template variables
    document.addEventListener("DOMContentLoaded", function() {
      const svg = document.querySelector("#main-svg-container svg");
      if (!svg) return;
      
      // Data from server (Jinja2 template variables)
      const links = ["", "", "", "../tour/5.html"];
      const coor_xs = [0, 180, 230, 190];
      const coor_ys = [-20, 50, 100, 320];
      const exposities = ["Welkom", "Skelet Mammoet2", "Bewegen", "Los hoes"];
      const svgns = "http://www.w3.org/2000/svg";
      const linkns = "http://www.w3.org/1999/xlink";
      const len = coor_xs.length;
      
      // Configuration for hotspot list display
      const listConfig = {
        x: 5,     // X position of list
        y: 10,    // Y starting position of list
        lineHeight: 15  // Distance between lines
      };
      
      for (let i = 0; i < len; i++) {
        const link = document.createElementNS(svgns, "a");
        link.setAttribute("class", "hotspot");
        link.setAttribute("href", links[i] || "");
        
        // Hotspot dimensions (circle when w=h and ry=w/2)
        const hotspotSize = 20;
        const hotspotRadius = 10;
        const x = coor_xs[i] || 50;
        const y = coor_ys[i] || 50;
        
        // Create hotspot rectangle
        const rect = document.createElementNS(svgns, "rect");
        rect.setAttribute("ry", hotspotRadius);
        rect.setAttribute("x", x - hotspotSize / 2);
        rect.setAttribute("y", y - hotspotSize / 2);
        rect.setAttribute("width", hotspotSize);
        rect.setAttribute("height", hotspotSize);
        rect.setAttribute("fill", "red");
        rect.setAttribute("fill-opacity", "0.3");
        
        // Add tooltip
        const title = document.createElementNS(svgns, "title");
        title.textContent = exposities[i];
        rect.appendChild(title);

        
        // Create centered text in hotspot
        const text = document.createElementNS(svgns, "text");
        text.setAttribute("x", x);
        text.setAttribute("y", y);
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("alignment-baseline", "middle");
        text.setAttribute("fill", "white");
        text.setAttribute("pointer-events", "none");
        text.setAttribute("font-size", (hotspotRadius * 1.4).toString());
        text.textContent = i;
        
        // Create label in list
        const label = document.createElementNS(svgns, "text");
        const labelX = listConfig.x;
        const labelY = listConfig.y + i * listConfig.lineHeight;
        label.setAttribute("x", labelX);
        label.setAttribute("y", labelY);
        label.setAttribute("text-anchor", "start");
        label.setAttribute("class", "hotspot-label");
        label.textContent = `${i}. ${exposities[i]}`;
        
        // Append elements
        link.appendChild(rect);
        link.appendChild(text);
        link.appendChild(label);
        svg.appendChild(link);
      }
    });

  </script>
</body>
