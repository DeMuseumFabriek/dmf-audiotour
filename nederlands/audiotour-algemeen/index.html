<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <title>De Museumfabriek Audiotour</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />

  <!-- Base CSS (mobile-first audiotour styles) -->
  <link rel="stylesheet" href="../../static/css/reset.css" />
  <link rel="stylesheet" href="../../static/css/typography.css" />
  <link rel="stylesheet" href="../../static/css/layout.css" />

  <!-- Manager-only styles can still live here -->
  <style>
    body {
      margin: 0;
      background: #f7f7f9;
      color: #333;
      font-family: 'Open Sans', sans-serif;
    }

    /* === Audiotour header (mobile-first) === */
    .site-header {
      border-bottom: 1px solid #ddd;
      background: #fff;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
    }

    .logo {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: #333;
      }

    .nav .icons {
      display: flex;
      gap: 0.75rem;
    }

    .nav .icon {
      width: 22px;
      height: 22px;
    }

    /* === Manager navigation (desktop / beheer) === */
    .manager-nav {
      background: #2c3e50;
      padding: 0.75rem 1rem;
    }

    .manager-nav a {
      color: #fff;
      text-decoration: none;
      margin-right: 1rem;
      font-weight: 500;
    }

    .manager-nav a:hover {
      text-decoration: underline;
    }

    main {
      background: #fff;
      padding: 1rem;
    }

    footer {
      text-align: center;
      font-size: 0.8rem;
      color: #666;
      padding: 1rem 0;
    }
  </style>
</head>
<body>
